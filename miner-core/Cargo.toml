[package]
name = "miner-core"
version = "0.2.0"
edition = "2021"
description = "NEMES Miner Core — paylaşılan mantık (int8, worker, heartbeat, resources)"
publish = false

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
sysinfo = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
indicatif = { workspace = true }
base64 = "0.21"
zip = "0.6"
which = "4.0"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
blake3 = "1"
nemes-core = { path = "../../nemes-p2p/nemes-core" }
nemes-p2p = { path = "../../nemes-p2p/nemes-p2p" }
