[package]
name = "nemes-miner"
version = "0.2.0"
description = "NEMES Miner — Mine knowledge. Not hashes."
authors = ["d3str0y1ng"]
publish = false
repository = "https://github.com/nemes-x/miner"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "dialog-all", "shell-open", "fs-exists", "fs-read-file", "fs-write-file", "http-request", "notification-all", "os-all", "path-all", "updater"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
chrono = "0.4"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
