[package]
name = "komuta-rs"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "NEMES Komuta API - Rust port (Axum + sqlx)"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "multipart", "ws"] }
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["cors", "trace", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "2.0"
blake3 = "1.5"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nemes-core = { path = "../../nemes-p2p/nemes-core" }
nemes-p2p = { path = "../../nemes-p2p/nemes-p2p" }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
once_cell = "1.19"